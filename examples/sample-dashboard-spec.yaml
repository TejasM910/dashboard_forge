dashboard: {name: RetailCo Weekly Sales, audience: leadership, refresh: "daily 08:00 IST", timezone: Asia/Kolkata}
filters:
  - {id: date_range, type: date, default: last_12_weeks}
  - {id: region, type: multiselect, rls: region_manager}
pages:
  - name: Overview
    rows:
      - widgets:
          - {id: w1, type: kpi_card, metric: net_revenue, compare: yoy, requirement_ids: [REQ-001]}
          - {id: w2, type: kpi_card, metric: orders, compare: yoy, requirement_ids: [REQ-002]}
          - {id: w3, type: kpi_card, metric: aov, compare: yoy, requirement_ids: [REQ-003]}
          - {id: w4, type: kpi_card, metric: conversion_rate, compare: yoy, requirement_ids: [REQ-004]}
      - widgets:
          - {id: w5, type: line, metric: net_revenue, x: week, series: channel, requirement_ids: [REQ-001, REQ-006]}
          - {id: w6, type: bar_horizontal, metric: net_revenue, dimension: product, top_n: 10, requirement_ids: [REQ-007]}
          - {id: w7, type: bar_horizontal, metric: net_revenue, dimension: region, top_n: 5, requirement_ids: [REQ-007]}
